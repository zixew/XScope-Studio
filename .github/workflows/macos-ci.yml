name: macOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift & Xcode version
        run: |
          swift --version
          xcodebuild -version
      - name: Build
        run: swift build
      - name: Run Unit Tests
        run: swift test
